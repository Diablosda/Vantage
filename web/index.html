<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vantage</title><link rel="icon" type="image/x-icon" href="/assets/vantage.ico?v=2.0.6"><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Vantage 首页"><img class="brandmark" src="/assets/vantage.png?v=2.0.6" alt="" width="32" height="32"><span>Vantage</span></a><span class="divider"></span><input id="projectName" aria-label="工程名称" value="未命名预演" maxlength="60"><span id="dirty" class="muted">未保存</span><div class="top-spacer"></div><span id="engineStatus" class="engine"><i></i>本地引擎</span><button data-action="help" class="ghost" aria-label="使用帮助">?</button><button data-action="closeWorkspace">关闭工作区</button><button data-action="new">新建</button><button data-action="open">打开</button><button data-action="save" id="saveBtn" title="保存当前工程 (Ctrl+S)">保存</button><button data-action="saveAs" title="另存为新工程 (Ctrl+Shift+S)">另存为</button><button data-action="export" class="primary">导出视频 <span>↗</span></button></header>
<main class="workbench">
 <aside class="scene-panel"><div id="sceneResize" class="scene-resize" role="separator" aria-label="调整场景面板宽度" aria-orientation="vertical" tabindex="0" title="拖动调整面板宽度"></div><div class="panel-heading"><span>场景对象 <b id="objectCount">0</b></span><button data-action="addMenu" id="addBtn" class="small primary">＋ 添加</button></div><div class="scene-tools"><button data-action="models">模型库</button><button data-action="replaceModel" title="用模型库中的 GLB 替换选中对象，保留运动">替换模型</button><button data-action="import">导入 .blend</button><button data-action="group" title="Shift 选中多个对象后组合">组合对象</button></div><div id="objectList" class="object-list"></div><div class="scene-footer"><div class="eyebrow">空间，由你安排</div><p>添加白模，确定位置与朝向。<br>再用路径表达镜头的时间。</p><button data-action="help" class="text-btn">查看操作指引 ↗</button></div></aside>
 <section class="stage"><div class="stage-toolbar"><div class="segmented" id="viewTabs"><button data-view="TOP" class="active">俯视</button><button data-view="FRONT">前视</button><button data-view="SIDE">侧视</button><button data-view="FREE">自由</button></div><label>图层 <select id="editLayer"><option value="OBJECT">物品图层</option><option value="CAMERA">相机图层</option></select></label><div class="toolbar-divider"></div><div class="segmented tools"><button data-tool="select" title="选择 (Q)">选择</button><button data-tool="translate" class="active" title="移动 (W)">移动</button><button data-tool="rotate" title="旋转 (E)">旋转</button><button data-tool="path" title="在正交视图中点击布点">布路径</button></div><div class="top-spacer"></div><button data-action="undo" id="undoBtn" class="icon-btn" title="撤销 Ctrl+Z">↶</button><button data-action="redo" id="redoBtn" class="icon-btn" title="重做 Ctrl+Shift+Z">↷</button><button data-action="frame" title="聚焦当前对象 (F)">聚焦</button></div>
  <div id="viewport" class="viewport"><div class="view-label"><span id="viewName">俯视 · XY</span><span class="view-sub">正交工作区</span></div><div id="emptyHint" class="empty-hint"><span class="empty-symbol">＋</span><h2>从一个白模开始</h2><p>添加基本体，或导入已有的静态场景</p><button data-action="addBox">添加立方体</button></div><div class="viewport-bottom"><span id="selectionHint">拖动彩色轴自由移动 · 三视图方向键微调</span><span id="coords">Z ↑ &nbsp; 单位</span></div></div>
  <div class="stage-status"><label><input id="snap" type="checkbox" checked> 网格吸附</label><select id="grid" aria-label="网格步长"><option value="0.25">0.25 单位</option><option value="0.5">0.5 单位</option><option value="1" selected>1 单位</option><option value="custom">自定义</option></select><button data-action="sceneScale" id="sceneScaleBtn" title="调整背景场景与人物的相对比例">场景比例 1×</button><label><input id="helpers" type="checkbox" checked> 辅助线</label><select id="space" aria-label="操作坐标"><option value="world">世界坐标</option><option value="local">本地坐标</option></select><span class="top-spacer"></span><span class="legend"><i class="amber"></i>未设镜头 <i style="background:#52d8ef"></i>粗线：已设镜头</span></div>
 </section>
 <aside class="inspector-panel"><button id="expandInspector" class="inspector-handle" aria-label="展开设置" aria-expanded="false" title="展开设置">&lt;&lt;&lt;</button><div class="preview-heading"><span>摄影机画面</span><button data-action="renderFrame" id="renderFrame" title="按当前机位和时间用 Blender 渲染">Blender 渲染</button><button data-action="fullscreen" class="icon-btn" aria-label="全屏摄影机预览">⛶</button></div><div id="preview" class="preview"><img id="clipFrame" class="hidden" alt="轨道片段当前渲染帧"><img id="blenderFrame" class="hidden" alt="当前机位的 Blender 渲染画面"><button id="previewPlay" class="preview-play" title="播放 / 暂停完整视频" aria-label="播放完整视频">▶</button><div id="noCamera">添加摄影机以预览取景</div><span id="previewInfo" class="preview-info"></span></div><div class="camera-select"><select id="activeCamera" aria-label="活动摄影机"></select><button data-action="selectCamera" title="选择当前摄影机">C</button><button data-action="selectTarget" title="选择视线目标">T</button></div><div class="inspector-tabs"><button data-tab="object" class="active">对象</button><button data-tab="path">路径</button><button data-tab="camera">镜头</button><button data-tab="output">输出</button></div><div id="inspector" class="inspector"></div></aside>
 <section class="timeline-panel"><div class="timeline-heading"><span class="timeline-title">完整视频时间轴 <span>所有对象共享时间</span></span><div class="transport"><button data-action="start" title="回到起点">|◀</button><button data-action="play" id="playBtn" class="play-btn" aria-label="播放">▶</button><button data-action="end" title="到片段末尾">▶|</button><span id="timeReadout">00:00.00</span><span class="muted">/</span><input id="duration" type="number" min="0.05" max="600" step="0.1" aria-label="片段时长" value="5"><span class="muted">秒</span></div><div class="timeline-options"><label><input id="loop" type="checkbox" checked> 循环</label><select id="fps" aria-label="帧率"><option>24</option><option>25</option><option>30</option><option>48</option><option>60</option></select><span>FPS</span><button data-action="zoomOut" title="缩小时间轴">−</button><button data-action="zoomIn" title="放大时间轴">＋</button></div></div><div class="timeline-body"><div class="track-labels" id="trackLabels"></div><div class="tracks-scroll" id="tracksScroll"><div id="tracks" class="tracks"><div id="ruler" class="ruler"></div><div id="trackLanes"></div><div id="playhead" class="playhead"><span></span></div></div></div></div><div class="timeline-footer"><span id="statusText">就绪 · 所有操作在本机完成</span><span>空格 播放 / 暂停 &nbsp; · &nbsp; Ctrl+S 保存</span></div></section>
</main>
<div id="addMenu" class="popup hidden"><div class="eyebrow">添加到场景</div><button data-add="CHARACTER"><span>♙</span>人物白模 <small>高 1.75</small></button><button data-add="BOX"><span>◇</span>立方体 <small>1 × 1 × 1 单位</small></button><button data-add="RECT"><span>▱</span>长方体 <small>自由设置尺寸</small></button><button data-add="SPHERE"><span>○</span>球体</button><button data-add="CYLINDER"><span>⊙</span>圆柱体</button><button data-add="CONE"><span>△</span>圆锥体</button><hr><button data-add="CAMERA"><span>▣</span>摄影机 + 视线目标</button></div>
<input id="motionFile" type="file" accept=".glb" hidden><input id="openFile" type="file" accept=".previs,.previs.zip,.zip,.blend" hidden><input id="importFile" type="file" accept=".blend" hidden>
<dialog id="dialog"><div class="dialog-header"><h2 id="dialogTitle"></h2><button data-action="closeDialog" class="icon-btn" aria-label="关闭">×</button></div><div id="dialogBody"></div><div id="dialogActions"></div></dialog><div id="toast" role="status" class="toast hidden"></div>
<script type="module" src="/app.js"></script></body></html>
